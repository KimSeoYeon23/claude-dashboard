services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=claude_dashboard
      - MYSQL_USER=dashboard
      - MYSQL_PASSWORD=dashboard
    volumes:
      - mysql-data:/var/lib/mysql

  dashboard:
    build: .
    ports:
      - "8420:8420"
    volumes:
      - dashboard-data:/app/data
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=dashboard
      - MYSQL_PASSWORD=dashboard
      - MYSQL_DATABASE=claude_dashboard
    depends_on:
      - mysql

volumes:
  dashboard-data:
  mysql-data:
