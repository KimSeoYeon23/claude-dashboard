services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql

  dashboard:
    build: .
    ports:
      - "8420:8420"
    volumes:
      - dashboard-data:/app/data
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
    depends_on:
      - mysql

volumes:
  dashboard-data:
  mysql-data:
