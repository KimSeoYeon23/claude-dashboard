services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=claude_dashboard
      - MYSQL_USER=dashboard
      - MYSQL_PASSWORD=dashboard
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m uvicorn backend.app:app --host 0.0.0.0 --port 8420 --reload"
    ports:
      - "8420:8420"
    volumes:
      - .:/app
      - dashboard-data:/app/data
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=dashboard
      - MYSQL_PASSWORD=dashboard
      - MYSQL_DATABASE=claude_dashboard
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    depends_on:
      - mysql

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8420

volumes:
  dashboard-data:
  mysql-data:
  frontend-node-modules:
