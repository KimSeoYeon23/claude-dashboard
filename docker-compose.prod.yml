services:
  mysql:
    image: mysql:8.0
    expose:
      - "3306"
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  dashboard:
    build: .
    expose:
      - "8420"
    volumes:
      - dashboard-data:/app/data
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
    depends_on:
      - mysql
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    restart: unless-stopped

volumes:
  dashboard-data:
  mysql-data:
  caddy-data:
